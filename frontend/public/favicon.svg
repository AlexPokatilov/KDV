<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .k8s-circle { fill: #326ce5; }
      .k8s-line { stroke: #326ce5; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>
  <!-- Top circle -->
  <circle cx="50" cy="25" r="11" class="k8s-circle"/>
  <!-- Bottom-left circle -->
  <circle cx="28" cy="68" r="11" class="k8s-circle"/>
  <!-- Bottom-right circle -->
  <circle cx="72" cy="68" r="11" class="k8s-circle"/>
  <!-- Top to bottom-left line -->
  <line x1="45" y1="34" x2="32" y2="59" class="k8s-line"/>
  <!-- Top to bottom-right line -->
  <line x1="55" y1="34" x2="68" y2="59" class="k8s-line"/>
  <!-- Bottom-left to bottom-right line -->
  <line x1="28" y1="69" x2="72" y2="69" class="k8s-line"/>
</svg>
